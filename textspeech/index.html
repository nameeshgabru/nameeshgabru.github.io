<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text-Speech</title>
    <style>
      /* Container for pitch & rate controls */
      .speech-settings {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;

        .speech-setting {
          display: flex;
          flex-direction: column;
          min-width: 120px;

          label {
            font-weight: 600;
            margin-bottom: 0.25rem;
          }

          .setting-input {
            width: 100%;
            padding: 0.25rem;
            border: 1px solid #ccc;
            border-radius: 8px;
          }
        }
      }

      /* Voice selection dropdown */
      .voice-section {
        margin: 1rem 0;

        .section-title {
          font-size: 1.2rem;
          margin-bottom: 0.5rem;
        }

        .voice-dropdown {
          width: 100%;
          padding: 0.5rem;
          border-radius: 8px;
          border: 1px solid #ccc;
        }
      }

      /* Buttons: Start, Stop, Pause */
      .speech-buttons {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;

        button {
          min-width: 100px;
        }

        .pause-button {
          margin-left: auto;
        }
      }

      /* Progress range bar */
      .speech-progress {
        margin: 1rem 0;

        label {
          font-weight: 600;
          display: block;
          margin-bottom: 0.5rem;
        }

        .progress-bar {
          width: 100%;
        }
      }

      /* Spoken text output */
      .speech-output {
        background: #f9f9f9;
        border-radius: 10px;
        padding: 1rem;
        margin: 1rem 0;
        line-height: 1.5;
        font-size: 1rem;
      }

      /* Editable text area */
      .text-editor {
        margin-top: 1rem;

        button {
          margin-bottom: 0.5rem;
        }

        .editor-textarea {
          width: 100%;
          min-height: 150px;
          border: 1px solid #ccc;
          border-radius: 10px;
          resize: vertical;
          font-family: monospace;
        }
      }
    </style>
  </head>
  <body>
    <div class="speech-settings">
      <div class="speech-setting">
        <label for="pitchInput">Pitch</label>
        <input
          id="pitchInput"
          type="number"
          min="0.1"
          max="3"
          step="0.1"
          value="1"
          class="setting-input"
          onchange="handleChangePitch(this)"
        />
      </div>

      <div class="speech-setting">
        <label for="rateInput">Rate</label>
        <input
          id="rateInput"
          type="number"
          min="0.1"
          max="3"
          step="0.1"
          value="1"
          class="setting-input"
          onchange="handleChangeRate(this)"
        />
      </div>
    </div>

    <div class="voice-section">
      <h2 class="section-title">Voices</h2>
      <select
        id="voiceSelect"
        class="voice-dropdown"
        onchange="handleChangeVoice(this)"
      ></select>
    </div>

    <div class="speech-buttons">
      <button id="startButton" onclick="startSpeech()">Start</button>
      <button id="stopButton" onclick="stopSpeech()">Stop</button>
      <button id="pauseButton" onclick="pauseSpeech()" class="pause-button">
        Pause
      </button>
    </div>
    <div class="speech-progress">
      <label for="progressRange">Progress</label>
      <input
        id="progressRange"
        type="range"
        class="progress-bar"
        value="0"
        min="0"
        step="1"
        onchange="handleChangeProgress(this)"
      />
    </div>

    <p class="speech-output" id="speech_output"></p>

    <div>
      <button id="select_all">Select All</button>
    </div>
    <div class="text-editor">
      <textarea id="text_input" class="editor-textarea">
On a rainy afternoon, little Maya sat by the window, watching raindrops race down the glass. The streets were shiny with puddles, and everything smelled fresh and new. She folded a small paper boat from her homework sheet — the one she didn’t like anyway — and ran outside, laughing as her shoes splashed in the water. She placed the boat on a puddle and whispered, “Sail far, little one.” The boat wobbled, caught a stream of water, and drifted away, carrying her secret wish for an adventure. The next day, when the rain was gone, Maya found a tiny white feather on her doorstep — as if the boat had sailed the world and sent her a gift back. And from then on, every time it rained, she smiled and made another boat.</textarea
      >
    </div>

    <div>
      use this while sending text as params :
      `$url\?text=$yourString.replace(/[^a-zA-Z0-9]/g, '')`
    </div>
    <script>
      let pitch = 1;
      let rate = 1;
      let progress = 0;
      const params = new URLSearchParams(window.location.search);
      let text = params.get("text");
      if (text) {
        document.getElementById("text_input").value = text;
      }
      let voices = window.speechSynthesis.getVoices();
      let selectedVoice;
      window.speechSynthesis.onvoiceschanged = () => {
        voices = window.speechSynthesis.getVoices();
        let lastVoice = localStorage.getItem("selected_voice");
        if (lastVoice) {
          selectedVoice = voices.find((v) => v.voiceURI === lastVoice);
        } else {
          selectedVoice = voices[0];
        }
        let selectEl = document.getElementById("voiceSelect");
        //update dropdown and its value
        voices.forEach((voice) => {
          const opt = document.createElement("option");
          opt.value = voice.voiceURI;
          opt.textContent = voice.voiceURI;
          selectEl.appendChild(opt);
        });

        // Set the selected value
        selectEl.value = selectedVoice.voiceURI;
      };
      function handleChangeProgress(event) {
        speakingIndex = +event.value;
        console.log(speakingIndex);
      }
      function handleChangeVoice(event) {
        localStorage.setItem("selected_voice", event.value);
        selectedVoice = voices.find((v) => v.voiceURI === event.value);
      }
      function handleChangePitch(event) {
        pitch = +event.value;
      }
      function handleChangeRate(event) {
        rate = +event.value;
      }
      let sentences = [];
      function startSpeech() {
        if (window.speechSynthesis.speaking) {
          return;
        }
        sentences = document
          .getElementById("text_input")
          .value.match(/[^\.!\?]+[\.!\?]+["']?|\s*$/g);
        document.getElementById("progressRange").max = sentences.length;
        handleText();
      }
      speakingIndex = 0;
      function handleText() {
        if (sentences[speakingIndex] || sentences[speakingIndex] === "") {
          speakSentence(() => {
            handleText();
          });
        } else {
          document.getElementById("speech_output").innerHTML = "";
          speakingIndex = 0;
        }
      }
      paused = false;
      function speakSentence(cb) {
        let utter = new SpeechSynthesisUtterance(sentences[speakingIndex]);
        utter.onend = function () {
          if (paused === false) {
            cb();
          }
        };
        utter.onboundary = function (event) {
          if (event.name === "word") {
            let currentSentence = sentences[speakingIndex - 1];
            let html =
              currentSentence.slice(0, event.charIndex) +
              "<b>" +
              currentSentence.slice(
                event.charIndex,
                event.charIndex + event.charLength
              ) +
              "</b>" +
              currentSentence.slice(
                event.charIndex + event.charLength,
                currentSentence.length
              );
            document.getElementById("speech_output").innerHTML = html;
          }
        };
        utter.rate = rate;
        utter.pitch = pitch;
        if (selectedVoice) {
          utter.voice = voices.find((v) => v === selectedVoice);
        }
        window.speechSynthesis.speak(utter);
        document.getElementById("progressRange").value = speakingIndex;
        speakingIndex++;
      }
      function stopSpeech() {
        sentences = [];
        speakingIndex = 0;
        document.getElementById("progressRange").value = speakingIndex;
        window.speechSynthesis.cancel();
      }
      function pauseSpeech() {
        if (paused === true) {
          paused = false;
          handleText();
        } else {
          paused = true;
          speakingIndex--;
          window.speechSynthesis.cancel();
        }
      }
    </script>
  </body>
</html>
